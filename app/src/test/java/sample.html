<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is a title</title>
</head>

<body>
    <h1> This heading is outside the section </h1>
    <section>
        <h1> This heading is inside the section </h1>
        <p> [ and ]</p>

        <table>
            <thead>
                <tr>
                    <th> This is a table heading </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        This is a table data cell
                    </td>
                </tr>
            </tbody>
        </table>

        <p> boring <em>italic</em> boring <b>bold</b> boring <strong>strong</strong> boring <a href="#anchor">anchor</a> boring</p>

        <ul>
            <li>ul item 1</li>
            <li>ul item 2</li>
            <li>ul item 3</li>
        </ul>

        <ol>
            <li>ol item 1</li>
            <li>ol item 2</li>
            <li>ol item 3</li>
        </ol>
    </section>
</body>

</html>
